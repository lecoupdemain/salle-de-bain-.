<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Salle de bain 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#f3f1ed;--panel:#fff;--ink:#23211e;--mut:#6d6a64;--line:#dcd8d0;--acc:#9a7432;--accink:#fff;--field:#f6f4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--panel:#1d1f24;--ink:#ece8df;--mut:#9c9a93;--line:#34363d;--acc:#d2a95c;--accink:#1b1608;--field:#262930}}
:root[data-theme="dark"]{--bg:#15161a;--panel:#1d1f24;--ink:#ece8df;--mut:#9c9a93;--line:#34363d;--acc:#d2a95c;--accink:#1b1608;--field:#262930}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "Avenir Next","Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
#side{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
h2{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select,button{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat button{text-align:left;font-weight:500;padding:9px 10px}
.cat small{display:block;color:var(--mut);font-size:11px;font-weight:400}
#selbox{display:none;border:1px solid var(--acc);border-radius:10px;padding:12px;gap:8px;flex-direction:column}
#bill ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
#bill li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
#bill b{white-space:nowrap}
.note{font-size:11.5px;color:var(--mut)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);background:var(--panel)}
#tabs button{width:auto;padding:8px 16px}
#tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#stage{flex:1;position:relative;min-height:0}
#gl,#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#gl canvas{display:block}
#plan{display:none;background:#12263f}
#hint{position:absolute;left:12px;bottom:12px;background:rgba(20,20,24,.78);color:#eee;padding:7px 12px;border-radius:8px;font-size:12px;pointer-events:none}
@media (max-width:760px){body{flex-direction:column-reverse}#side{width:100%;min-width:0;height:46vh;border-right:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="side">
  <h1>Studio Salle de bain</h1>
  <div id="selbox">
    <div class="note">Élément sélectionné</div>
    <b id="selname">-</b>
    <div class="g2"><div><label>Largeur (cm)</label><input type="number" id="sw" step="5" min="20" max="250"></div><div><label>Profondeur (cm)</label><input type="number" id="sd" step="5" min="4" max="120"></div></div>
    <div id="hrow"><label>Hauteur d’allège (cm)</label><input type="number" id="sh" value="100" step="5" min="0" max="150"></div><div id="finrow"><label>Finition du caisson</label><select id="sfin"></select></div>
    <div class="g2"><button id="brot">Pivoter 90°</button><button id="bdel">Supprimer</button></div>
  </div>
  <div>
    <h2>Pièce et revêtements</h2>
    <div class="g3"><div><label>Long. (cm)</label><input type="number" id="rl" value="300" step="10" min="150"></div><div><label>Larg. (cm)</label><input type="number" id="rw" value="240" step="10" min="150"></div><div><label>Haut. (cm)</label><input type="number" id="rh" value="250" step="5" min="220"></div></div>
    <div style="margin-top:8px"><label>Sol</label><select id="tf"><option value="slate">Ardoise anthracite 60×120</option><option value="terrazzo">Terrazzo clair 60×60</option><option value="concrete">Béton minéral 60×60</option><option value="oak">Parquet chêne clair</option><option value="herring">Parquet à chevrons chêne</option><option value="cement">Carreaux de ciment 30×30</option><option value="nero">Marbre noir veiné 60×60</option></select></div>
    <div style="margin-top:8px"><label>Murs</label><select id="tw"><option value="zellige">Zellige vert sauge 10×10</option><option value="marble">Marbre blanc veiné 60×120</option><option value="metro">Carreau métro blanc 7,5×15</option><option value="trav">Travertin beige 60×120</option><option value="plaster">Enduit tadelakt sable</option><option value="nero">Marbre noir veiné 60×60</option><option value="cement">Carreaux de ciment 30×30</option><option value="concrete">Béton minéral 60×60</option></select></div>
  </div>
  <div class="cat">
    <h2>Équipements</h2>
    <div class="g2">
      <button data-add="vanity">Meuble vasque<small>type GODMORGON</small></button>
      <button data-add="shower">Douche à l’italienne<small>receveur + paroi</small></button>
      <button data-add="wc">WC suspendu<small>bâti-support</small></button>
      <button data-add="bath">Baignoire<small>170×70</small></button>
      <button data-add="mirror">Miroir LED<small>type LILLÅNGEN</small></button>
      <button data-add="rad">Sèche-serviettes<small>eau chaude</small></button><button data-add="wc2">WC à poser<small>sans bâti</small></button><button data-add="door">Porte<small>83 cm</small></button><button data-add="window">Fenêtre<small>allège réglable</small></button>
    </div>
  </div>
  <div id="bill">
    <h2>Métré plomberie</h2>
    <ul id="billList"></ul>
    <p class="note" style="margin-top:6px">Longueurs depuis la gaine technique, +15 % et +1,50 m par ligne.</p>
  </div>
  <button id="bclear">Vider la pièce</button>
</div>
<div id="main">
  <div id="tabs"><button data-v="3d" class="on">Vue 3D</button><button data-v="top">Vue de dessus</button><button data-v="plan">Plan technique</button></div>
  <div id="stage"><div id="gl"></div><canvas id="plan"></canvas><div id="hint">Glisser un équipement pour le déplacer · glisser le fond pour tourner · molette pour zoomer · Suppr pour effacer</div></div>
</div>
<script>
const $=i=>document.getElementById(i);
let L=3,W=2.4,H=2.5,items=[],sel=null,view='3d',uid=1,drag=null,orb=null;
const FIN={white:['Blanc brillant',0xf4f4f2],oak:['Chêne clair',0xc8a06a],anth:['Gris anthracite',0x3a3f45],green:['Vert sauge',0x7d8f79]};
const DEF={vanity:{n:'Meuble vasque',w:.8,d:.47,fin:'oak'},shower:{n:'Douche',w:1.2,d:.8},wc:{n:'WC suspendu',w:.4,d:.55},bath:{n:'Baignoire',w:1.7,d:.7},mirror:{n:'Miroir LED',w:.8,d:.04},rad:{n:'Sèche-serviettes',w:.5,d:.1},wc2:{n:'WC à poser',w:.38,d:.68},door:{n:'Porte',w:.83,d:.06},window:{n:'Fenêtre',w:.8,d:.08}};
const COL={vanity:'#d2a95c',shower:'#6fb7d6',wc:'#cfd6dd',bath:'#9fc9e6',mirror:'#f0e2b6',rad:'#e08a7a',wc2:'#cfd6dd',door:'#c8a06a',window:'#8fd0ff'};
for(const k in FIN)$('sfin').add(new Option(FIN[k][0],k));

/* ---------- Textures procédurales ---------- */
const KIND={
 slate:{b:[40,44,50],c:2,r:1,v:10,gr:'#15171a',gl:.5,sp:1},
 terrazzo:{b:[222,214,200],c:2,r:2,v:6,gr:'#bdb5a6',gl:.4,fl:1},
 concrete:{b:[150,152,152],c:2,r:2,v:8,gr:'#8a8c8c',gl:.7,sp:1},
 oak:{b:[196,156,104],c:1,r:8,v:14,gr:'#6b4f2f',gl:.5,wood:1},
 marble:{b:[238,238,236],c:2,r:1,v:3,gr:'#cfd0d0',gl:.12,vein:1},
 zellige:{b:[112,142,120],c:12,r:12,v:20,gr:'#e3e0d6',gl:.1},
 metro:{b:[247,247,245],c:8,r:16,v:3,gr:'#b4b4b0',gl:.12,st:1},
 trav:{b:[214,196,164],c:2,r:1,v:8,gr:'#b9a785',gl:.5,band:1},
 herring:{b:[0,0,0],c:1,r:0,v:0,gr:'#000',gl:.45},cement:{b:[0,0,0],c:1,r:0,v:0,gr:'#000',gl:.35},plaster:{b:[0,0,0],c:1,r:0,v:0,gr:'#000',gl:.85},
 nero:{b:[24,24,27],c:2,r:2,v:4,gr:'#0d0d0f',gl:.08,vein:1}
};
function grain(g,S){for(let n=0;n<6000;n++){g.fillStyle=Math.random()<.5?'rgba(0,0,0,.05)':'rgba(255,255,255,.05)';g.fillRect(Math.random()*S,Math.random()*S,2,2)}}
function special(k,g,S){const R=Math.random;
 if(k==='herring'){const bh=S/8,P=S/2,f=x=>Math.abs((x%P)-P/2);
  for(let b=-3;b<9;b++)for(let s=0;s<16;s++){const x1=s*S/16,x2=x1+S/16,y=b*bh;
   g.fillStyle=`rgb(${150+R()*50|0},${105+R()*40|0},${62+R()*30|0})`;
   g.beginPath();g.moveTo(x1,y+f(x1));g.lineTo(x2,y+f(x2));g.lineTo(x2,y+f(x2)+bh);g.lineTo(x1,y+f(x1)+bh);g.closePath();g.fill();
   g.strokeStyle='rgba(50,30,15,.6)';g.lineWidth=3;g.stroke();
   for(let n=0;n<5;n++){g.strokeStyle='rgba(80,50,25,.12)';g.lineWidth=1;g.beginPath();g.moveTo(x1,y+f(x1)+R()*bh);g.lineTo(x2,y+f(x2)+R()*bh);g.stroke()}}}
 else if(k==='cement'){const u=S/4;
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){const a=(i+j)%2,c1=a?'#c9694a':'#1f3a5f',c2=a?'#1f3a5f':'#c9694a';
   g.save();g.translate((i+.5)*u,(j+.5)*u);g.beginPath();g.rect(-u/2,-u/2,u,u);g.clip();
   g.fillStyle='#efe6d3';g.fillRect(-u/2,-u/2,u,u);
   g.fillStyle=c1;g.rotate(Math.PI/4);g.fillRect(-u*.3,-u*.3,u*.6,u*.6);g.rotate(-Math.PI/4);
   g.fillStyle=c2;g.beginPath();g.arc(0,0,u*.2,0,7);g.fill();
   g.strokeStyle=c1;g.lineWidth=5;g.strokeRect(-u/2+10,-u/2+10,u-20,u-20);
   for(let n=0;n<4;n++){g.fillStyle=c2;g.beginPath();g.arc(Math.cos(n*Math.PI/2+Math.PI/4)*u*.4,Math.sin(n*Math.PI/2+Math.PI/4)*u*.4,u*.05,0,7);g.fill()}
   g.restore();g.strokeStyle='#b5aa95';g.lineWidth=4;g.strokeRect(i*u,j*u,u,u)}}
 else if(k==='plaster'){g.fillStyle='#d6c4a6';g.fillRect(0,0,S,S);
  for(let n=0;n<140;n++){const x=R()*S,y=R()*S,r=40+R()*140,gr=g.createRadialGradient(x,y,0,x,y,r),c=R()<.5?'255,250,240':'150,125,95';gr.addColorStop(0,`rgba(${c},.10)`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}}
 else if(k==='nero'){for(let n=0;n<10;n++){g.strokeStyle=`rgba(235,235,235,${.2+R()*.5})`;g.lineWidth=1+R()*3;g.beginPath();g.moveTo(R()*S,0);g.bezierCurveTo(R()*S,S*.3,R()*S,S*.6,R()*S,S);g.stroke()}}
}
function tex(kind,rx,ry){
 const K=KIND[kind],S=1024,cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');
 const tw=S/K.c,th=S/K.r,R=Math.random,sh=(a,v)=>`rgb(${a.map(x=>Math.max(0,Math.min(255,x+v)))})`;
 for(let i=0;i<K.r;i++){const off=K.st?(i%2?tw/2:0):K.wood?R()*tw:0;
  for(let j=-1;j<=K.c;j++){const x=j*tw+off,y=i*th;
   g.save();g.beginPath();g.rect(x,y,tw,th);g.clip();
   g.fillStyle=sh(K.b,(R()-.5)*K.v*2);g.fillRect(x,y,tw,th);
   if(K.wood){for(let n=0;n<14;n++){g.strokeStyle=`rgba(90,60,30,${.05+R()*.12})`;g.lineWidth=1;g.beginPath();const yy=y+R()*th;g.moveTo(x,yy);g.bezierCurveTo(x+tw*.3,yy+R()*4-2,x+tw*.6,yy+R()*4-2,x+tw,yy);g.stroke()}}
   if(K.vein){for(let n=0;n<3;n++){g.strokeStyle=`rgba(120,125,130,${.15+R()*.25})`;g.lineWidth=1+R()*2;g.beginPath();g.moveTo(x+R()*tw,y);g.bezierCurveTo(x+R()*tw,y+th*.3,x+R()*tw,y+th*.6,x+R()*tw,y+th);g.stroke()}}
   if(K.fl){for(let n=0;n<40;n++){g.fillStyle=['#8c7b6a','#b9a58f','#5d6b74','#d8cfc2','#a3523f'][n%5];g.beginPath();g.arc(x+R()*tw,y+R()*th,1.5+R()*3,0,7);g.fill()}}
   if(K.sp){for(let n=0;n<160;n++){g.fillStyle=`rgba(${R()<.5?255:0},${R()<.5?255:0},${R()<.5?255:0},.05)`;g.fillRect(x+R()*tw,y+R()*th,2,2)}}
   if(K.band){for(let n=0;n<6;n++){g.fillStyle='rgba(150,120,80,.12)';g.fillRect(x,y+R()*th,tw,2+R()*3)}}
   if(kind==='zellige'){const gr=g.createLinearGradient(x,y,x+tw,y+th);gr.addColorStop(0,'rgba(255,255,255,.18)');gr.addColorStop(1,'rgba(0,0,0,.14)');g.fillStyle=gr;g.fillRect(x,y,tw,th)}
   g.restore();g.strokeStyle=K.gr;g.lineWidth=kind==='zellige'?5:3;g.strokeRect(x,y,tw,th)}}
 special(kind,g,S);grain(g,S);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;
 return new THREE.MeshPhysicalMaterial({map:t,bumpMap:t,bumpScale:1,roughness:K.gl,metalness:.02,clearcoat:K.gl<.3?.7:0,clearcoatRoughness:.08,side:THREE.DoubleSide});
}

/* ---------- Scène ---------- */
const gl=$('gl');let scene,persp,ortho,cam,rend,room,hl;
const sph={t:.7,p:1.0,r:5};
const M=(c,r=.4,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const CH=M(0xd9dadd,.12,.95),WH=M(0xffffff,.12);
function initScene(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x2a2c31);
 persp=new THREE.PerspectiveCamera(42,1,.1,60);ortho=new THREE.OrthographicCamera(-1,1,1,-1,.1,30);cam=persp;
 rend=new THREE.WebGLRenderer({antialias:true});rend.setPixelRatio(Math.min(devicePixelRatio,2));
 rend.shadowMap.enabled=true;rend.shadowMap.type=THREE.PCFSoftShadowMap;rend.outputEncoding=THREE.sRGBEncoding;rend.toneMapping=THREE.ACESFilmicToneMapping;rend.toneMappingExposure=1.05;
 gl.appendChild(rend.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x9a9086,.45));
 const es=new THREE.Scene();es.background=new THREE.Color(0x9a9690);
 [[0,5,0,6,.2,6,0xffffff,4],[5,2,0,.2,3,6,0xfff1dc,3],[-5,2,2,.2,3,5,0xcfe3ff,2],[0,2,5,6,3,.2,0xffffff,1.5]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),new THREE.MeshBasicMaterial({color:new THREE.Color(a[6]).multiplyScalar(a[7])}));m.position.set(a[0],a[1],a[2]);es.add(m)});
 scene.environment=new THREE.PMREMGenerator(rend).fromScene(es,.03).texture;
 const d=new THREE.DirectionalLight(0xfff1dc,.8);d.position.set(4,6,5);d.castShadow=true;d.shadow.mapSize.set(2048,2048);
 Object.assign(d.shadow.camera,{left:-5,right:5,top:5,bottom:-5});d.shadow.bias=-.0004;scene.add(d);
 const p=new THREE.PointLight(0xffd9a0,.55,8);p.position.set(1.5,2.3,1.2);scene.add(p);scene.userData.pl=p;
 hl=new THREE.BoxHelper(new THREE.Object3D(),0xd2a95c);hl.visible=false;scene.add(hl);
 buildRoom();resize();loop();
}
function buildRoom(){
 if(room)scene.remove(room);room=new THREE.Group();
 const fk=$('tf').value,wk=$('tw').value;
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(L,W),tex(fk,L/1.2,W/1.2));fl.rotation.x=-Math.PI/2;fl.position.set(L/2,0,W/2);fl.receiveShadow=true;room.add(fl);
 const bw=new THREE.Mesh(new THREE.PlaneGeometry(L,H),tex(wk,L/1.2,H/1.2));bw.position.set(L/2,H/2,0);bw.receiveShadow=true;room.add(bw);
 const lw=new THREE.Mesh(new THREE.PlaneGeometry(W,H),tex(wk,W/1.2,H/1.2));lw.rotation.y=Math.PI/2;lw.position.set(0,H/2,W/2);lw.receiveShadow=true;room.add(lw);
 const sm=M(0xe9e5dc,.8),box=(a,b,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),sm);m.position.set(x,y,z);room.add(m)};
 box(L+.2,H,.1,L/2,H/2,-.05);box(.1,H,W,-.05,H/2,W/2);box(L+.2,.04,.1,L/2,.02,W+.05);box(.1,.04,W,L+.05,.02,W/2);
 const ghm=new THREE.MeshBasicMaterial({color:0xcfd8e6,transparent:true,opacity:.07,side:THREE.DoubleSide,depthWrite:false});
 const f1=new THREE.Mesh(new THREE.PlaneGeometry(L,H),ghm);f1.position.set(L/2,H/2,W);room.add(f1);
 const f2=new THREE.Mesh(new THREE.PlaneGeometry(W,H),ghm);f2.rotation.y=Math.PI/2;f2.position.set(L,H/2,W/2);room.add(f2);
 const col=new THREE.Mesh(new THREE.BoxGeometry(.3,H,.3),M(0xd8d3c8,.9));col.position.set(.15,H/2,.15);col.castShadow=true;room.add(col);
 scene.add(room);scene.userData.pl.position.set(L/2,H-.2,W/2);
 sph.r=Math.max(L,W)*1.9;
}
function build(it){
 const g=new THREE.Group(),{w,d}=it;
 const B=(a,b,c)=>new THREE.BoxGeometry(a,b,c),C=(r,h)=>new THREE.CylinderGeometry(r,r,h,24);
 const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m};
 const z0=-d/2;
 if(it.type==='vanity'){
  add(B(w,.5,d),M(FIN[it.fin][1],.4),0,.55,0);
  add(B(w*.8,.015,.014),M(0x2a2a2a,.3,.8),0,.72,d/2+.006);add(B(w*.8,.015,.014),M(0x2a2a2a,.3,.8),0,.45,d/2+.006);
  add(B(w+.02,.04,d+.02),M(0xffffff,.1),0,.82,0);
  const n=w>=1.1?2:1;
  for(let i=0;i<n;i++){const x=n===2?(i?1:-1)*w/4:0;
   add(B(Math.min(.46,w/n-.1),.03,.34),M(0xf3f6f8,.05),x,.845,.03);add(C(.03,.012),CH,x,.862,.03);
   add(C(.015,.2),CH,x,.94,z0+.06);add(C(.01,.14),CH,x,1.03,z0+.12).rotation.x=Math.PI/2}
 }else if(it.type==='shower'){
  add(B(w,.04,d),M(0xf2f2ef,.25),0,.02,0);add(B(.12,.006,.12),CH,-w/2+.25,.043,0);
  const gw=w*.9,gm=new THREE.MeshStandardMaterial({color:0xcfe6ee,transparent:true,opacity:.22,roughness:0,metalness:.1});
  add(B(gw,1.95,.01),gm,w/2-gw/2,1.02,d/2-.01);add(B(gw,.02,.03),CH,w/2-gw/2,2.0,d/2-.01);
  add(B(.16,.16,.025),CH,0,1.05,z0+.015);add(C(.012,1.0),CH,0,1.55,z0+.03);
  add(B(.3,.015,.3),CH,0,2.1,z0+.2);add(C(.012,.18),CH,0,2.1,z0+.06).rotation.x=Math.PI/2;
 }else if(it.type==='wc'){
  add(B(w,1.0,.18),M(0xdcdad4,.7),0,.6,z0+.09);add(B(.22,.14,.01),CH,0,1.0,z0+.185);
  const bowl=add(new THREE.SphereGeometry(.18,28,18),WH,0,.4,z0+.2);bowl.scale.set(.95,.62,1.4);
  const seat=add(C(.17,.02),M(0xffffff,.2),0,.455,z0+.2);seat.scale.set(1,1,1.4);
 }else if(it.type==='bath'){
  add(B(w,.55,d),WH,0,.275,0);add(B(w-.1,.02,d-.1),M(0xbfdcee,.05),0,.55,0);
  add(C(.015,.22),CH,-w/2+.1,.66,0);add(C(.01,.12),CH,-w/2+.16,.76,0).rotation.z=Math.PI/2;
 }else if(it.type==='mirror'){
  add(B(w+.06,.76,.012),new THREE.MeshBasicMaterial({color:0xffe6bd}),0,1.5,.006);
  add(B(w,.7,.03),M(0x30333a,.4),0,1.5,.026);add(B(w-.04,.66,.006),M(0xe6edf0,.03,.9),0,1.5,.044);
 }else if(it.type==='wc2'){
  add(B(w*.8,.43,.2),WH,0,.215,z0+.1);add(B(w,.4,.2),WH,0,.63,z0+.1);add(B(.12,.02,.05),CH,0,.84,z0+.1);
  const bw2=add(new THREE.SphereGeometry(.2,28,18),WH,0,.2,z0+.36);bw2.scale.set(.9,.9,1.55);
  const st2=add(C(.17,.02),M(0xffffff,.2),0,.42,z0+.36);st2.scale.set(1,1,1.5);
 }else if(it.type==='door'){
  add(B(w+.1,2.09,.06),M(0xf1efe9,.5),0,1.045,0);add(B(w,2.04,.03),M(0xb98e5b,.55),0,1.02,.045);
  add(B(w*.7,.75,.006),M(0xa57c4a,.6),0,1.5,.063);add(B(w*.7,.75,.006),M(0xa57c4a,.6),0,.55,.063);
  add(C(.01,.1),CH,w/2-.08,1.02,.09).rotation.z=Math.PI/2;
 }else if(it.type==='window'){
  const wh=1.2,y=it.sill,fr=M(0xf5f5f3,.4);
  add(B(w+.08,wh+.08,.08),fr,0,y+wh/2,0);
  add(B(w-.04,wh-.04,.02),new THREE.MeshStandardMaterial({color:0xdff3ff,transparent:true,opacity:.6,roughness:0,metalness:.2,emissive:0xbfe3ff,emissiveIntensity:.8}),0,y+wh/2,.04);
  add(B(.03,wh,.05),fr,0,y+wh/2,.045);add(B(w,.03,.05),fr,0,y+wh/2,.045);add(B(w+.16,.03,.14),fr,0,y-.03,.03);
 }else if(it.type==='rad'){
  for(let i=0;i<9;i++)add(B(w,.025,.035),M(0xf2f2f0,.4),0,.35+i*.15,.03);
  add(B(.03,1.45,.04),M(0xf2f2f0,.4),-w/2+.02,1.05,.03);add(B(.03,1.45,.04),M(0xf2f2f0,.4),w/2-.02,1.05,.03);
 }
 return g;
}
function mk(it){if(it.g)scene.remove(it.g);it.g=build(it);scene.add(it.g);place(it)}
function place(it){it.g.position.set(it.x,0,it.z);it.g.rotation.y=it.rot}
function q(it){return((Math.round(it.rot/(Math.PI/2))%4)+4)%4}
function contact(it){
 const k=q(it),sw=k%2===1,hx=(sw?it.d:it.w)/2,hz=(sw?it.w:it.d)/2;
 it.x=Math.max(hx,Math.min(L-hx,it.x));it.z=Math.max(hz,Math.min(W-hz,it.z));
 if(k===0)it.z=hz;else if(k===1)it.x=hx;else if(k===3)it.x=L-hx;else it.z=W-hz;
}
function snap(it){
 const a=[it.z,it.x,L-it.x,W-it.z],m=Math.min(...a);
 it.rot=[0,Math.PI/2,-Math.PI/2,Math.PI][a.indexOf(m)];contact(it);
}
function addItem(type){
 const D=DEF[type],it={id:uid++,type,name:D.n,w:D.w,d:D.d,fin:D.fin||'white',sill:1,x:L/2,z:.3,rot:0};
 contact(it);mk(it);items.push(it);select(it);refresh();
}
function select(it){
 sel=it;const b=$('selbox');b.style.display=it?'flex':'none';
 if(it){$('selname').textContent=it.name;$('sw').value=Math.round(it.w*100);$('sd').value=Math.round(it.d*100);$('sfin').value=it.fin;$('finrow').style.display=it.type==='vanity'?'block':'none';$('hrow').style.display=it.type==='window'?'block':'none';$('sh').value=Math.round(it.sill*100)}
 hl.visible=!!it;
}
function del(){if(!sel)return;scene.remove(sel.g);items.splice(items.indexOf(sel),1);select(null);refresh()}

/* ---------- Plomberie ---------- */
const FEED={cold:[.1,.1],hot:[.1,.15],dr:[.1,.2]};
function portsOf(it){
 const d=it.d,z=-d/2+.05,t=it.type,p={};
 if(t==='vanity'){p.cold=[-.08,z];p.hot=[.08,z];p.dr=[0,z+.02]}
 else if(t==='shower'){p.cold=[-.08,z];p.hot=[.08,z];p.dr=[-it.w/2+.25,0]}
 else if(t==='wc'){p.cold=[0,z+.05];p.dr=[0,z+.12]}
 else if(t==='bath'){p.cold=[-it.w/2+.1,-.08];p.hot=[-it.w/2+.1,.08];p.dr=[-it.w/2+.1,0]}
 else if(t==='wc2'){p.cold=[.1,z];p.dr=[0,z+.08]}
 else if(t==='rad'){p.hot=[-it.w/2+.02,0]}
 const c=Math.cos(it.rot),s=Math.sin(it.rot),o={};
 for(const k in p)o[k]=[it.x+p[k][0]*c+p[k][1]*s,it.z-p[k][0]*s+p[k][1]*c];
 return o;
}
function route(k,P){const F=FEED[k];return[F,[P[0],F[1]],P]}
function rlen(r){return Math.abs(r[1][0]-r[0][0])+Math.abs(r[2][1]-r[1][1])}
function refresh(){
 const ul=$('billList');ul.innerHTML='';
 if(!items.length){ul.innerHTML='<li><span class="note">Ajoutez un équipement pour obtenir le métré.</span></li>'}
 else{
  let c=0,h=0,d40=0,d100=0;
  items.forEach(it=>{const P=portsOf(it);
   if(P.cold)c+=rlen(route('cold',P.cold));if(P.hot)h+=rlen(route('hot',P.hot));
   if(P.dr){const l=rlen(route('dr',P.dr));if(/^wc/.test(it.type))d100+=l;else d40+=l}});
  const f=v=>v>0?(v*1.15+1.5).toFixed(1)+' m':null,row=(a,b)=>{if(b){const li=document.createElement('li');li.innerHTML=`<span>${a}</span><b>${b}</b>`;ul.appendChild(li)}};
  row('Multicouche eau froide',f(c));row('Multicouche eau chaude',f(h));row('PVC évacuation Ø40',f(d40));row('PVC évacuation Ø100 (WC)',f(d100));
  const n=t=>items.filter(i=>i.type===t).length;
  const taps=items.filter(i=>i.type==='vanity').reduce((a,i)=>a+(i.w>=1.1?2:1),0);
  row('Mitigeurs lavabo',taps?taps+' u':null);
  row('Receveurs de douche',n('shower')?n('shower')+' u':null);row('Bâtis-supports WC',n('wc')?n('wc')+' u':null);
  row('Baignoires',n('bath')?n('bath')+' u':null);row('WC à poser (sans bâti)',n('wc2')?n('wc2')+' u':null);row('Blocs-portes',n('door')?n('door')+' u':null);row('Fenêtres',n('window')?n('window')+' u':null);row('Alim. 230 V miroir LED',n('mirror')?n('mirror')+' pt':null);
 }
 if(sel&&hl.visible)hl.setFromObject(sel.g);
 if(view==='plan')drawPlan();
}

/* ---------- Plan technique ---------- */
const pc=$('plan');
function drawPlan(){
 const dpr=Math.min(devicePixelRatio,2),cw=pc.clientWidth,ch=pc.clientHeight;pc.width=cw*dpr;pc.height=ch*dpr;
 const g=pc.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
 const s=Math.min((cw-150)/L,(ch-170)/W),ox=(cw-L*s)/2+10,oy=(ch-W*s)/2+10,X=x=>ox+x*s,Z=z=>oy+z*s;
 g.fillStyle='#12263f';g.fillRect(0,0,cw,ch);
 g.strokeStyle='rgba(140,180,230,.13)';g.lineWidth=1;
 for(let x=0;x<=L+1e-6;x+=.1){g.beginPath();g.moveTo(X(x),Z(0));g.lineTo(X(x),Z(W));g.stroke()}
 for(let z=0;z<=W+1e-6;z+=.1){g.beginPath();g.moveTo(X(0),Z(z));g.lineTo(X(L),Z(z));g.stroke()}
 g.strokeStyle='#e8f0fb';g.lineWidth=5;g.strokeRect(X(0),Z(0),L*s,W*s);
 g.fillStyle='rgba(232,240,251,.25)';g.fillRect(X(0),Z(0),.3*s,.3*s);g.lineWidth=1.5;g.strokeRect(X(0),Z(0),.3*s,.3*s);
 g.font='11px sans-serif';g.fillStyle='#e8f0fb';g.fillText('Gaine',X(.02),Z(.45));
 items.forEach(it=>{g.save();g.translate(X(it.x),Z(it.z));g.rotate(it.rot);
  g.fillStyle='rgba(255,255,255,.07)';g.strokeStyle=COL[it.type];g.lineWidth=2;g.fillRect(-it.w/2*s,-it.d/2*s,it.w*s,it.d*s);g.strokeRect(-it.w/2*s,-it.d/2*s,it.w*s,it.d*s);
  if(it.type==='door'){g.lineWidth=1.5;g.setLineDash([4,4]);g.beginPath();g.moveTo(-it.w/2*s,0);g.lineTo(-it.w/2*s,it.w*s);g.moveTo(it.w/2*s,0);g.arc(-it.w/2*s,0,it.w*s,0,Math.PI/2);g.stroke();g.setLineDash([])}
  if(it.type==='window'){g.lineWidth=1.5;g.beginPath();g.moveTo(-it.w/2*s,0);g.lineTo(it.w/2*s,0);g.stroke()}
  g.restore();g.fillStyle='#e8f0fb';g.font='11px sans-serif';g.textAlign='center';g.fillText(`${it.name} ${Math.round(it.w*100)}×${Math.round(it.d*100)}`,X(it.x),Z(it.z)+4);
  g.fillStyle='#8fb0d6';g.fillText(`axe x ${Math.round(it.x*100)} · z ${Math.round(it.z*100)} cm`,X(it.x),Z(it.z)+17);g.textAlign='left'});
 const line=(pts,col,w,dash)=>{g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Z(p[1])):g.moveTo(X(p[0]),Z(p[1])));g.stroke();g.setLineDash([])};
 items.forEach(it=>{const P=portsOf(it);
  if(P.dr)line(route('dr',P.dr),'#b8bec6',/^wc/.test(it.type)?5:3,[8,5]);
  if(P.cold)line(route('cold',P.cold),'#4aa8ff',2.5);
  if(P.hot)line(route('hot',P.hot),'#ff6b5b',2.5);
  for(const k in P){g.fillStyle=k==='cold'?'#4aa8ff':k==='hot'?'#ff6b5b':'#b8bec6';g.beginPath();g.arc(X(P[k][0]),Z(P[k][1]),3.5,0,7);g.fill()}});
 g.strokeStyle='#e8f0fb';g.fillStyle='#e8f0fb';g.lineWidth=1;g.font='12px sans-serif';
 g.beginPath();g.moveTo(X(0),Z(0)-18);g.lineTo(X(L),Z(0)-18);g.stroke();g.textAlign='center';g.fillText(Math.round(L*100)+' cm',X(L/2),Z(0)-24);
 g.beginPath();g.moveTo(X(0)-18,Z(0));g.lineTo(X(0)-18,Z(W));g.stroke();g.save();g.translate(X(0)-24,Z(W/2));g.rotate(-Math.PI/2);g.fillText(Math.round(W*100)+' cm',0,0);g.restore();
 g.textAlign='left';g.font='bold 14px sans-serif';g.fillText('Plan technique plomberie',14,22);
 g.font='12px sans-serif';[['#4aa8ff','Eau froide'],['#ff6b5b','Eau chaude'],['#b8bec6','Évacuation (gros trait : Ø100 WC)']].forEach((l,i)=>{g.fillStyle=l[0];g.fillRect(14,ch-70+i*18,24,3);g.fillStyle='#e8f0fb';g.fillText(l[1],46,ch-65+i*18)});
}

/* ---------- Caméra et interactions ---------- */
function setView(v){
 view=v;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 gl.style.display=v==='plan'?'none':'block';pc.style.display=v==='plan'?'block':'none';
 $('hint').style.display=v==='plan'?'none':'block';
 cam=v==='top'?ortho:persp;resize();if(v==='plan')drawPlan();
}
function resize(){
 const w=gl.clientWidth||1,h=gl.clientHeight||1;rend.setSize(w,h);const a=w/h;persp.aspect=a;persp.updateProjectionMatrix();
 const hh=Math.max(W/2+.5,(L/2+.5)/a);ortho.left=-hh*a;ortho.right=hh*a;ortho.top=hh;ortho.bottom=-hh;ortho.updateProjectionMatrix();
 if(view==='plan')drawPlan();
}
function placeCam(){
 if(view==='top'){ortho.position.set(L/2,12,W/2);ortho.up.set(0,0,-1);ortho.lookAt(L/2,0,W/2)}
 else{const t=new THREE.Vector3(L/2,.8,W/2);persp.position.set(t.x+sph.r*Math.sin(sph.p)*Math.sin(sph.t),t.y+sph.r*Math.cos(sph.p),t.z+sph.r*Math.sin(sph.p)*Math.cos(sph.t));persp.up.set(0,1,0);persp.lookAt(t)}
}
function loop(){requestAnimationFrame(loop);if(view==='plan')return;placeCam();if(sel&&hl.visible)hl.setFromObject(sel.g);rend.render(scene,cam)}
const ray=new THREE.Raycaster(),fp=new THREE.Plane(new THREE.Vector3(0,1,0),0),v2=new THREE.Vector2();
function ndc(e){const r=gl.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v2,cam)}
function floorPt(){const p=new THREE.Vector3();return ray.ray.intersectPlane(fp,p)?p:null}
gl.addEventListener('pointerdown',e=>{
 ndc(e);const hit=ray.intersectObjects(items.map(i=>i.g),true);
 if(hit.length){let o=hit[0].object;while(o.parent!==scene)o=o.parent;const it=items.find(i=>i.g===o);select(it);const p=floorPt();drag={it,dx:p?it.x-p.x:0,dz:p?it.z-p.z:0}}
 else{select(null);if(view==='3d')orb={x:e.clientX,y:e.clientY}}
 gl.setPointerCapture(e.pointerId);
});
gl.addEventListener('pointermove',e=>{
 if(drag){ndc(e);const p=floorPt();if(p){drag.it.x=p.x+drag.dx;drag.it.z=p.z+drag.dz;snap(drag.it);place(drag.it);refresh()}}
 else if(orb){sph.t-=(e.clientX-orb.x)*.006;sph.p=Math.max(.25,Math.min(1.5,sph.p-(e.clientY-orb.y)*.005));orb={x:e.clientX,y:e.clientY}}
});
const end=()=>{drag=null;orb=null};gl.addEventListener('pointerup',end);gl.addEventListener('pointercancel',end);
gl.addEventListener('wheel',e=>{e.preventDefault();sph.r=Math.max(2,Math.min(14,sph.r*(1+e.deltaY*.001)))},{passive:false});
addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&!/INPUT|SELECT/.test(document.activeElement.tagName))del()});
addEventListener('resize',resize);

/* ---------- Panneau ---------- */
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addItem(b.dataset.add));
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('bdel').onclick=del;$('bclear').onclick=()=>{items.forEach(i=>scene.remove(i.g));items=[];select(null);refresh()};
$('brot').onclick=()=>{if(!sel)return;sel.rot+=Math.PI/2;if(sel.rot>3.2)sel.rot-=2*Math.PI;contact(sel);place(sel);refresh()};
const upd=()=>{if(!sel)return;sel.w=Math.max(.2,(+$('sw').value||40)/100);sel.d=Math.max(.04,(+$('sd').value||10)/100);sel.fin=$('sfin').value;sel.sill=(+$('sh').value||0)/100;contact(sel);mk(sel);refresh()};
['sw','sd','sh'].forEach(i=>$(i).onchange=upd);$('sfin').onchange=upd;
const rebuild=()=>{L=Math.max(1.5,(+$('rl').value||300)/100);W=Math.max(1.5,(+$('rw').value||240)/100);H=Math.max(2.2,(+$('rh').value||250)/100);buildRoom();items.forEach(i=>{contact(i);place(i)});resize();refresh()};
['rl','rw','rh'].forEach(i=>$(i).onchange=rebuild);$('tf').onchange=$('tw').onchange=buildRoom;
initScene();
[['shower',L-.6,.4],['vanity',1.5,.3],['wc',2.0,.3],['mirror',1.5,.02]].forEach(([t,x,z])=>{addItem(t);const it=items[items.length-1];it.x=x;it.z=z;snap(it);place(it)});
select(null);refresh();
</script>
